<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="100%" height="100%">
  <defs>
    <filter id="boxShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="3" dy="3" stdDeviation="1" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <g id="checkGreen">
      <rect width="58" height="58" rx="2" fill="#588527" stroke="#111111" stroke-width="2.5" filter="url(#boxShadow)"/>
      <!-- 3D dark shadow underneath checkmark -->
      <path d="M 12 36 L 24 49 L 51 16 L 44 12 L 23 39 L 17 31 Z" fill="#2d4810" />
      <!-- White checkmark -->
      <path d="M 11 34 L 23 47 L 50 14 L 44 11 L 22 38 L 16 30 Z" fill="#ffffff" />
    </g>
  </defs>

  <rect width="400" height="320" fill="#ffffff"/>

  <!-- Word Title -->
  <text x="200" y="70" font-family="'Nunito', 'Segoe UI', Arial, sans-serif" font-size="44" font-weight="900" fill="#0000cd" text-anchor="middle">always</text>

  <!-- Row 1: 5 boxes -->
  <g transform="translate(38, 125)">
    <use href="#checkGreen" x="0" y="0"/>
    <use href="#checkGreen" x="66" y="0"/>
    <use href="#checkGreen" x="132" y="0"/>
    <use href="#checkGreen" x="198" y="0"/>
    <use href="#checkGreen" x="264" y="0"/>
  </g>

  <!-- Row 2: 5 boxes -->
  <g transform="translate(38, 205)">
    <use href="#checkGreen" x="0" y="0"/>
    <use href="#checkGreen" x="66" y="0"/>
    <use href="#checkGreen" x="132" y="0"/>
    <use href="#checkGreen" x="198" y="0"/>
    <use href="#checkGreen" x="264" y="0"/>
  </g>
</svg>
